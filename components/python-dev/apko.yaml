# Toolbox image (NOT distroless), modelled on Chainguard's python:latest-dev:
# a shell, pip/uv and a C toolchain to build virtualenvs that are copied into
# the distroless python image. CPython is the same melange build as python
# (melange.yaml is a symlink). See README.md.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    # melange output; its per-build key is passed with --keyring-append.
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - python-3.15@local
    - python-3.15-dev@local
    - py3.15-pip
    - py3.15-setuptools
    - uv
    - bash
    - busybox
    - build-base
    - ca-certificates-bundle
    - git

# OCI annotations (also written as config labels). apko adds
# image.source/revision/created; build.sh/publish.sh add image.version.
annotations:
  org.opencontainers.image.title: python-dev
  org.opencontainers.image.description: "Python 3.15 with pip, uv, a shell and a C toolchain, non-root, for building virtualenvs"
  org.opencontainers.image.licenses: PSF-2.0
  org.opencontainers.image.vendor: backend-bunny
  org.opencontainers.image.url: https://github.com/backend-bunny/container-dropshipping/tree/main/components/python-dev
  org.opencontainers.image.documentation: https://github.com/backend-bunny/container-dropshipping/blob/main/components/python-dev/README.md

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

environment:
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777

entrypoint:
  command: /usr/bin/python

archs:
  - x86_64
