# HAProxy straight from Wolfi (no melange). The 3.4 LTS stream is pinned by
# package name; the lock pins the exact release.
# version-package: haproxy-3.4-nocaps
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # -nocaps: no cap_net_bind_service file capability (exec fails when the
    # pod drops ALL caps) and no bash (haproxy-3.4 pulls it for its reload
    # helper scripts).
    - haproxy-3.4-nocaps
    # For `ca-file @system-ca` / verifying TLS backends.
    - ca-certificates-bundle

# OCI annotations (also written as config labels). apko adds
# image.source/revision/created; build.sh/publish.sh add image.version.
annotations:
  org.opencontainers.image.title: haproxy
  org.opencontainers.image.description: "HAProxy 3.4 LTS TCP/HTTP load balancer, distroless and non-root"
  org.opencontainers.image.licenses: GPL-2.0-or-later
  org.opencontainers.image.vendor: backend-bunny
  org.opencontainers.image.url: https://github.com/backend-bunny/container-dropshipping/tree/main/components/haproxy
  org.opencontainers.image.documentation: https://github.com/backend-bunny/container-dropshipping/blob/main/components/haproxy/README.md

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

paths:
  # Config mount point (ConfigMap/Secret); the image ships no config.
  - path: /etc/haproxy
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  # Runtime state: stats/admin socket, server-state files.
  - path: /var/lib/haproxy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o750

# Master-worker (-W) so SIGUSR2 reloads the config without a shell; -db keeps
# it in the foreground with logs on stderr.
entrypoint:
  command: /usr/bin/haproxy -W -db

cmd: -f /etc/haproxy/haproxy.cfg

archs:
  - x86_64
