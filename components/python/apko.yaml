# Distroless Python runtime, modelled on Chainguard's python:latest.
# CPython is built here with melange (melange.yaml); see README.md.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    # melange output; its per-build key is passed with --keyring-append.
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - python-3.15@local
    - ca-certificates-bundle

# OCI annotations (also written as config labels). apko adds
# image.source/revision/created; build.sh/publish.sh add image.version.
annotations:
  org.opencontainers.image.title: python
  org.opencontainers.image.description: "Python 3.15 runtime, distroless and non-root"
  org.opencontainers.image.licenses: PSF-2.0
  org.opencontainers.image.vendor: backend-bunny
  org.opencontainers.image.url: https://github.com/backend-bunny/container-dropshipping/tree/main/components/python
  org.opencontainers.image.documentation: https://github.com/backend-bunny/container-dropshipping/blob/main/components/python/README.md

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

environment:
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/bin/python

archs:
  - x86_64
