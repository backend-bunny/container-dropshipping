package:
  name: signal-cli
  epoch: 0
  description: "Command-line and JSON-RPC/HTTP daemon interface for the Signal messenger"
  # signal-cli itself, plus the two bundled parts under copyleft licenses.
  # The other dependency jars in lib/ carry their own licenses.
  copyright:
    - license: GPL-3.0-only
    - license: AGPL-3.0-only
      paths:
        - usr/lib/signal-cli/lib/libsignal-client-*.jar
    - license: GPL-2.0-only WITH Classpath-exception-2.0
      paths:
        - usr/lib/signal-cli/jre/*
  dependencies:
    runtime:
      - glibc
      - zlib
      # libsignal_jni (shipped inside the libsignal-client jar, extracted at
      # runtime) links libstdc++/libgcc_s — invisible to melange SCA.
      - libstdc++
      - libgcc
  # Keep version last and vars.expected-commit right below it: Renovate's
  # regex must match both in one span to bump them together.
  # renovate: datasource=github-tags depName=AsamK/signal-cli
  version: "0.14.9"
vars:
  expected-commit: 3997429779095ff3a2d64c877126e84fce9852aa

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - openjdk-25
      - openjdk-25-default-jvm
      - zip
  environment:
    JAVA_HOME: /usr/lib/jvm/default-jvm
    # melange mounts --cache-dir here; CI persists it between runs, so the
    # Gradle distribution and Maven dependencies aren't re-downloaded.
    GRADLE_USER_HOME: /var/cache/melange/gradle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AsamK/signal-cli
      tag: v${{package.version}}
      expected-commit: ${{vars.expected-commit}}
  - name: Build
    runs: |
      set -e
      # Upstream-pinned Gradle via the wrapper (distribution fetched from
      # services.gradle.org, checksum-validated by the wrapper).
      ./gradlew --no-daemon --console=plain installDist -x test
  - name: Link a minimal Java runtime
    runs: |
      set -e
      # Several deps ship module-info.class with requires jdeps can't resolve
      # from a class path (rxjava3 -> org.reactivestreams, micronaut split
      # packages). Analyse scratch copies with module-info stripped.
      mkdir -p /tmp/jdeps
      cp build/install/signal-cli/lib/*.jar /tmp/jdeps/
      for jar in /tmp/jdeps/*.jar; do
        zip -q -d "$jar" 'module-info.class' 'META-INF/versions/*/module-info.class' \
          >/dev/null 2>&1 || true
      done
      CP=$(ls /tmp/jdeps/*.jar | tr '\n' ':')
      # jdeps prints errors on stdout; keep them visible if it fails.
      if ! MODULES=$("$JAVA_HOME/bin/jdeps" --multi-release 25 --ignore-missing-deps \
          --print-module-deps --class-path "$CP" /tmp/jdeps/*.jar); then
        echo "jdeps failed: $MODULES"
        exit 1
      fi
      # jdeps misses reflective/service-loaded modules; add the usual suspects.
      MODULES="$MODULES,jdk.unsupported,jdk.naming.dns,jdk.zipfs"
      echo "jlink modules: $MODULES"
      "$JAVA_HOME/bin/jlink" \
        --add-modules "$MODULES" \
        --add-options="-Djava.awt.headless=true" \
        --strip-debug --no-header-files --no-man-pages \
        --output /tmp/jre
      # java.desktop is needed (java.beans), but its GUI/sound natives link
      # X11/ALSA/freetype/lcms/jpeg — drop them so melange SCA doesn't pull
      # those into the image. Headless AWT (libawt_headless) stays.
      for so in libawt_xawt libjawt libsplashscreen libfontmanager liblcms \
          libjavajpeg libjsound; do
        rm -f "/tmp/jre/lib/$so.so"
      done
  - name: Install
    runs: |
      set -e
      APP_DIR="${{targets.destdir}}/usr/lib/signal-cli"
      mkdir -p "$APP_DIR"
      cp -r build/install/signal-cli/lib "$APP_DIR/lib"
      cp -r /tmp/jre "$APP_DIR/jre"
      # Only ship the x86_64 Linux libsignal JNI lib — drop macOS/Windows/test
      # natives bundled in the libsignal-client jar.
      for jar in "$APP_DIR"/lib/libsignal-client-*.jar; do
        zip -q -d "$jar" '*.dll' '*.dylib' '*_testing_*' 2>/dev/null || true
      done
  - name: List bundled third-party sources
    runs: |
      set -e
      # Maven jars in lib/ and the jlink'd JDK have no APK of their own, so the
      # image SBOM doesn't list them. Declare them for hack/sources.py.
      cat > /tmp/bundled-sources.gradle <<'GRADLE'
      import groovy.json.JsonOutput
      import org.gradle.api.artifacts.component.ModuleComponentIdentifier

      rootProject {
        tasks.register("bundledSources") {
          doLast {
            def entries = configurations.runtimeClasspath.incoming.artifacts.artifacts
              .collect { it.id.componentIdentifier }
              .findAll { it instanceof ModuleComponentIdentifier }
              .unique { it.displayName }
              .collect { id ->
                def e = [
                  name: "${id.group}:${id.module}".toString(),
                  version: id.version,
                  purl: "pkg:maven/${id.group}/${id.module}@${id.version}".toString(),
                  source: "https://repo1.maven.org/maven2/${id.group.replace('.', '/')}/${id.module}/${id.version}/".toString(),
                ]
                // AGPL-3.0: point at the real source, not the Maven artifact.
                if (id.group == "org.signal" && id.module == "libsignal-client") {
                  e.source = "https://github.com/signalapp/libsignal"
                  e.ref = "v${id.version}".toString()
                  // Published outside Maven Central: no POM to read it from.
                  e.license = "AGPL-3.0-only"
                }
                e
              }
            // The JDK that jlink trimmed into jre/: the Wolfi build package.
            def db = ["/usr/lib/apk/db/installed", "/lib/apk/db/installed"]
              .collect { new File(it) }.find { it.exists() }
            def m = db.text =~ /(?m)^P:openjdk-25\nV:(\S+)/
            if (!m.find()) throw new GradleException("openjdk-25 not in ${db}")
            entries << [
              name: "openjdk-25 (jlink runtime in jre/)",
              version: m.group(1),
              purl: "pkg:apk/wolfi/openjdk-25@${m.group(1)}".toString(),
              source: "https://packages.wolfi.dev/os/x86_64/openjdk-25-${m.group(1)}.apk".toString(),
              license: "GPL-2.0-only WITH Classpath-exception-2.0",
            ]
            file(System.getenv("BUNDLED_OUT")).text = JsonOutput.prettyPrint(JsonOutput.toJson(entries))
          }
        }
      }
      GRADLE
      DOC="${{targets.destdir}}/usr/share/doc/signal-cli"
      mkdir -p "$DOC"
      BUNDLED_OUT="$DOC/bundled-sources.json" ./gradlew --no-daemon --console=plain \
        --offline --no-configuration-cache --init-script /tmp/bundled-sources.gradle \
        -q bundledSources
      echo "bundled entries: $(grep -c '"purl"' "$DOC/bundled-sources.json")"
  - uses: strip

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        set -e
        JAVA=/usr/lib/signal-cli/jre/bin/java
        $JAVA --enable-native-access=ALL-UNNAMED \
          -cp '/usr/lib/signal-cli/lib/*' org.asamk.signal.Main --version
        # Trust store must be populated for TLS to Signal's servers.
        n=$(/usr/lib/signal-cli/jre/bin/keytool -list -cacerts -storepass changeit | grep -c trustedCertEntry)
        echo "cacerts entries: $n"
        test "$n" -gt 50
        # Bundled jars + JDK are declared for the source manifest.
        grep -q '"pkg:maven/org.signal/libsignal-client@' /usr/share/doc/signal-cli/bundled-sources.json
        grep -q '"pkg:apk/wolfi/openjdk-25@' /usr/share/doc/signal-cli/bundled-sources.json
        # Loads libsignal_jni + sqlite natives; fails if a native dep is missing.
        mkdir -p /tmp/sc-test
        $JAVA --enable-native-access=ALL-UNNAMED \
          -cp '/usr/lib/signal-cli/lib/*' org.asamk.signal.Main \
          --config /tmp/sc-test listAccounts
