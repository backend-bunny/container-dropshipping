contents:
  repositories:
    - https://packages.wolfi.dev/os
    # melange output; its per-build key is passed with --keyring-append.
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - signal-cli@local

# OCI annotations (also written as config labels). apko adds
# image.source/revision/created; build.sh/publish.sh add image.version.
annotations:
  org.opencontainers.image.title: signal-cli
  org.opencontainers.image.description: "signal-cli (Signal messenger CLI and JSON-RPC/HTTP daemon), distroless and non-root"
  org.opencontainers.image.licenses: GPL-3.0-only
  org.opencontainers.image.vendor: backend-bunny
  org.opencontainers.image.url: https://github.com/backend-bunny/container-dropshipping/tree/main/components/signal-cli
  org.opencontainers.image.documentation: https://github.com/backend-bunny/container-dropshipping/blob/main/components/signal-cli/README.md

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  HOME: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Account state (keys, sqlite DB). Mount a PVC here.
  - path: /var/lib/signal-cli
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  # libsignal + sqlite-jdbc extract their JNI libs to java.io.tmpdir at startup.
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777

# No shell: invoke the JVM directly instead of upstream's bin/signal-cli script.
# The JVM expands the lib/* classpath wildcard itself.
entrypoint:
  command: /usr/lib/signal-cli/jre/bin/java --enable-native-access=ALL-UNNAMED -cp /usr/lib/signal-cli/lib/* org.asamk.signal.Main --config /var/lib/signal-cli

# Default: multi-account JSON-RPC/HTTP daemon (health: GET /api/v1/check).
cmd: daemon --http 0.0.0.0:8080

archs:
  - x86_64
