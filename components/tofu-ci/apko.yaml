# Toolbox image (NOT distroless): GitLab's Kubernetes executor runs job scripts
# through `sh`, so busybox is included. See README.md.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    # melange output; its per-build key is passed with --keyring-append.
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - opentofu@local
    - tofu-ci-gitconfig@local
    - age
    - busybox
    - ca-certificates-bundle
    - curl
    - git
    - jq
    - openssh-client

# OCI annotations (also written as config labels). apko adds
# image.source/revision/created; build.sh/publish.sh add image.version.
annotations:
  org.opencontainers.image.title: tofu-ci
  org.opencontainers.image.description: "OpenTofu CLI with age, curl, jq, git and ssh, non-root, for GitLab CI Kubernetes-executor jobs"
  org.opencontainers.image.licenses: MPL-2.0
  org.opencontainers.image.vendor: backend-bunny
  org.opencontainers.image.url: https://github.com/backend-bunny/container-dropshipping/tree/main/components/tofu-ci
  org.opencontainers.image.documentation: https://github.com/backend-bunny/container-dropshipping/blob/main/components/tofu-ci/README.md

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

environment:
  HOME: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777

# No entrypoint: GitLab overrides it (jobs set `entrypoint: [""]`).
cmd: /bin/sh

archs:
  - x86_64
