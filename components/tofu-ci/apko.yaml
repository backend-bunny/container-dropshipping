# Toolbox image (NOT distroless): GitLab's Kubernetes executor runs job scripts
# through `sh`, so busybox is included. See README.md.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    # melange output; its per-build key is passed with --keyring-append.
    - "@local ./packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - opentofu@local
    - tofu-ci-gitconfig@local
    - age
    - busybox
    - ca-certificates-bundle
    - curl
    - git
    - jq
    - openssh-client

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

environment:
  HOME: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777

# No entrypoint: GitLab overrides it (nix-hosts sets `entrypoint: [""]`).
cmd: /bin/sh

archs:
  - x86_64
