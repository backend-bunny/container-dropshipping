name: Set up build tools
description: >-
  Install the devbox-pinned toolchain (melange, apko, cosign, bubblewrap, ...)
  and allow melange's bubblewrap sandbox on ubuntu-24.04 runners. With
  `component`, also restore (and at job end save) that component's download
  cache: Gradle/Go dependencies and melange's build-environment APKs.

inputs:
  component:
    description: Component whose build cache to restore and save (optional).
    default: ""

runs:
  using: composite
  steps:
    - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
      with:
        devbox-version: 0.18.4
        enable-cache: "true"

    # Ubuntu 24.04's AppArmor denies unprivileged user namespaces except to
    # binaries with a profile; nix's bwrap lives in /nix/store and has none.
    # The runner VM is ephemeral, so lifting the restriction is job-scoped.
    - name: Allow unprivileged user namespaces (melange bubblewrap)
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        devbox run -- bwrap --unshare-user --bind / / true

    # Keyed on melange.yaml and the apko lock: an upstream bump or a lock
    # refresh starts from the previous cache (restore-keys) and saves a new
    # entry, including newly downloaded source archives (hack/notices.py).
    # PR runs can read main's caches but only write their own, so PRs can't
    # poison main.
    - if: inputs.component != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache
        key: melange-${{ inputs.component }}-${{ hashFiles(format('components/{0}/melange.yaml', inputs.component), format('components/{0}/apko.lock.json', inputs.component)) }}
        restore-keys: melange-${{ inputs.component }}-
