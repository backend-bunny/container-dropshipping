name: ci

on:
  pull_request:
  # Used by lock-refresh: its PR is pushed with GITHUB_TOKEN, which doesn't
  # trigger pull_request. Without a PR base, every component is built.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      components: ${{ steps.discover.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: discover
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          components=$(hack/discover.sh "$BASE")
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "components: $components"

  build:
    needs: discover
    if: needs.discover.outputs.components != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    name: build (${{ matrix.component }})
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          component: ${{ matrix.component }}
      - name: Build (melange + apko from lockfile)
        run: devbox run -- hack/build.sh "$COMPONENT"
      - name: Source manifest summary
        run: |
          {
            echo "### $COMPONENT sources"
            echo
            cat "out/$COMPONENT/sources.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test image
        run: devbox run -- hack/test.sh "$COMPONENT"
      - name: Publish dry run
        run: DRY_RUN=1 devbox run -- hack/publish.sh "$COMPONENT"

  # Single required check for branch protection, independent of the matrix.
  ci-ok:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - run: |
          [[ "${{ needs.discover.result }}" == success ]]
          [[ "${{ needs.build.result }}" =~ ^(success|skipped)$ ]]
